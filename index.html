<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Self Tureng</title>
  <meta name="description" content="Fast, ad-free Tureng dictionary — EN/TR/DE/FR/ES.">

  <!-- PWA / iOS home screen -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Self Tureng">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#b71c1c" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

  <link rel="stylesheet" href="css/app.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try {
      var t = (JSON.parse(localStorage.getItem('tm.settings.v1') || '{}').theme) || 'auto';
      if (t !== 'auto') document.documentElement.dataset.theme = t;
    } catch (e) {}
    // Home-screen app: iOS can report a viewport shorter than the screen by the status bar height,
    // so size the app shell to the full screen instead (see body in app.css).
    (function () {
      var standalone = navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
      if (!standalone) return;
      function fit() {
        var h = window.innerHeight;
        var portrait = h >= window.innerWidth;
        var full = portrait ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
        if (full > h && full - h <= 100) h = full;
        document.documentElement.style.setProperty('--app-h', h + 'px');
      }
      fit();
      window.addEventListener('resize', fit);
      window.addEventListener('orientationchange', function () { setTimeout(fit, 300); });
    })();
  </script>
</head>
<body>
  <header class="appbar" id="appbar">
    <div class="appbar-row">
      <button class="home-btn" id="homeBtn" type="button" aria-label="Self Tureng — home">
        <svg viewBox="0 0 100 100" aria-hidden="true"><rect class="logo-bg" width="100" height="100" rx="24"/><path class="logo-fg" fill-rule="evenodd" d="M30 20h40a10 10 0 0 1 10 10v32a10 10 0 0 1-10 10H45l-15 12V72a10 10 0 0 1-10-10V30a10 10 0 0 1 10-10zM32 30v10h13v23h10V40h13V30z"/></svg>
      </button>
      <button class="icon-btn" id="backBtn" type="button" aria-label="Back" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <form class="search" id="searchForm" role="search" autocomplete="off">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" name="q" type="text" inputmode="search" enterkeyhint="search"
               autocapitalize="none" autocorrect="off" spellcheck="false"
               placeholder="Search a word or phrase" aria-label="Search">
        <button class="clear-btn" id="clearBtn" type="button" aria-label="Clear" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </form>
      <button class="icon-btn" id="settingsBtn" type="button" aria-label="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
    <nav class="pairs" id="pairs" aria-label="Dictionary"></nav>
  </header>

  <div class="suggest" id="suggest" role="listbox" hidden></div>

  <main id="view" class="view" tabindex="-1"></main>

  <div class="scrim" id="scrim" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></section>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
